base: ../../base/datasets/youtube_asl.yaml

dataset:
  source:
    stop_on_transcript_block: true
    # transcript_proxy_http: http://user:pass@host:port
    # transcript_proxy_https: http://user:pass@host:port
    max_text_length: 300
    min_duration: 0.2
    max_duration: 60.0
    text_processing:
      lowercase: false

processing:
  enabled: true
  processor: video2pose
  detection: mmdet
  pose: mmpose
  sample_rate: 0.5
  max_workers: 1
  detection_config:
    det_model_config: resources/detection_models/rtmdet/configs/rtmdet_nano_320-8xb32_coco-person.py
    det_model_checkpoint: resources/detection_models/rtmdet/checkpoints/rtmdet_nano_8xb32-100e_coco-obj365-person-05d8511e.pth
    device: "cuda:0"
    batch_size: 16
  pose_config:
    pose_model_config: mmpose::wholebody_2d_keypoint/rtmpose/cocktail14/rtmw-l_8xb320-270e_cocktail14-384x288.py
    pose_model_checkpoint: https://download.openmmlab.com/mmpose/v1/projects/rtmw/rtmw-dw-x-l_simcc-cocktail14_270e-384x288-20231122.pth
    device: "cuda:0"
    batch_size: 16

post_processing:
  enabled: true
  normalize:
    keypoint_preset: mmpose_133_to_85
    mode: xy_isotropic_z_minmax
    mask_empty_frames: true

output:
  enabled: true

run_name: default

paths:
  root: dataset/youtube_asl
