dataset:
  name: how2sign
  download: false
  manifest: true

processing:
  enabled: true
  processor: video2compression
  # Writes a COMPLETE mirror to <output_dir>/compressed: shrunk files where it
  # helped, originals hardlinked through where it did not. Nothing is deleted.
  # After the run, verify the mirror, then repoint paths.videos at it or delete
  # the originals yourself. Re-encoded files carry a .compression.json sidecar;
  # passthrough originals have none.
  sample_rate: null  # compression always preserves the source FPS
  # No detection backend: compression re-encodes whole frames and never crops,
  # so downstream consumers still choose their own regions.
  max_workers: 3
  video_config:
    # hevc_nvenc runs on Maxwell 2nd gen and newer. Switch to av1_nvenc on
    # Ada (RTX 40xx) or later for roughly another 20% at equal quality.
    codec: hevc_nvenc
    preset: p6          # p1 fastest ... p7 best; p6 is the usual knee
    crf: 26             # -cq on NVENC. PLACEHOLDER: set from the VMAF sweep
    aq_strength: 8
    max_bitrate_ratio: 0.8
    min_video_reduction_ratio: 0.10
  # No resize and no fps change: video2pose, video2crop and video2parts all
  # re-derive their crops from these frames at full resolution.

post_processing:
  enabled: false

output:
  enabled: false

run_name: compression

paths:
  root: dataset/how2sign
  videos: dataset/how2sign/videos
  manifest: dataset/how2sign/how2sign_realigned_val.csv
